name: POAO-frontend container dev

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/pto-frontend-container-dev.yml'
      - 'nais/dev-ekstern.yaml'
  workflow_dispatch:

concurrency:
  group: dab_frontend_container_dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: deploy gcp dev ekstern
        uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-ekstern.yaml
