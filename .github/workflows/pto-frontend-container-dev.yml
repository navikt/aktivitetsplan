name: POAO-frontend container dev

on:
  push:
    branches:
      - 'main'
    paths:
      - '.github/workflows/pto-frontend-container-dev.yml'
      - 'nais/dev-ekstern.yaml'
  workflow_dispatch:

concurrency:
  group: dab_frontend_container_dev
  cancel-in-progress: true

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # ratchet:actions/checkout@v7
      - name: deploy gcp dev ekstern
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # ratchet:nais/deploy/actions/deploy@v3
        env:
          CLUSTER: dev-gcp
          RESOURCE: nais/dev-ekstern.yaml
